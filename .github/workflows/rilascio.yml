# L'app per il computer, per chi la scarica da GitHub: a ogni tag v* (git tag v0.2.0 && git push origin v0.2.0) costruisce
# l'installatore per Windows e i pacchetti per Linux, li prova (l'app impacchettata si accende in una cartella temporanea e
# risponde) e li mette in una «release». Da «Run workflow» costruisce gli stessi file senza pubblicarli (negli artefatti).
# Il Mac per ora resta fuori: senza firma e notarizzazione Apple l'app scaricata non si apre (docs/DESKTOP.md).
name: Rilascio
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            comando: dist:win
            prova: ./dist/win-unpacked/Lumi.exe --prova
          - os: ubuntu-latest
            comando: dist:linux
            prova: xvfb-run -a ./dist/linux-unpacked/lumi-desktop --no-sandbox --prova
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: xmllint per le prove con lo schema ufficiale della fattura
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libxml2-utils
      - name: Prove del gestionale
        shell: bash
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./strumenti/rapporto-github.mjs --test-reporter-destination=stdout test/*.test.mjs
      - name: Electron e electron-builder
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Installatore
        working-directory: desktop
        shell: bash
        run: npm run ${{ matrix.comando }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: L'app impacchettata si accende e risponde
        working-directory: desktop
        shell: bash
        run: ${{ matrix.prova }} 2>&1 | tee prova.log; grep -q 'PROVA OK' prova.log
      - uses: actions/upload-artifact@v4
        with:
          name: lumi-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error
      - name: Release su GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          fail_on_unmatched_files: false
