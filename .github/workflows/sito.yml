# Pubblica la cartella sito/ su GitHub Pages a ogni modifica su main (Impostazioni → Pages → Origine: GitHub Actions).
name: Sito
on:
  push:
    branches: [main]
    paths: ['sito/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.pagine.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with: { path: sito }
      - id: pagine
        uses: actions/deploy-pages@v4
