# Lumi su un VPS o un server dell'ufficio, con HTTPS automatico (Let's Encrypt) grazie a Caddy.
#   1. un nome a dominio che punta al server (es. lumi.miazienda.it) e le porte 80 e 443 aperte
#   2. LUMI_DOMINIO=lumi.miazienda.it docker compose up -d
# Solo in rete locale, senza HTTPS: docker compose up -d lumi  (e si apre http://<ip-del-server>:4380)
services:
  lumi:
    build: .
    image: lumi:latest
    init: true   # Node non fa da «init»: così «docker compose stop» spegne Lumi subito, senza i 10 secondi di attesa
    restart: unless-stopped
    environment:
      LUMI_DATI: /dati
      LUMI_RETE: "1"
    volumes:
      - lumi-dati:/dati
      # i backup su un disco del server, fuori dal volume (in Lumi → Backup scegli la cartella /backup-esterni)
      # - /mnt/disco-backup/lumi:/backup-esterni
    ports:
      - "127.0.0.1:4380:4380"   # solo da questo server; da fuori si passa da Caddy
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [lumi]
    ports:
      - "80:80"
      - "443:443"
    environment:
      LUMI_DOMINIO: ${LUMI_DOMINIO:-localhost}
    command: caddy reverse-proxy --from ${LUMI_DOMINIO:-localhost} --to lumi:4380
    volumes:
      - caddy-dati:/data
volumes:
  lumi-dati:
  caddy-dati:
